steps:
- task: NuGetToolInstaller@1
  displayName: 'Use NuGet'
  inputs:
    versionSpec: ${{ parameters.nuget_version }}

- task: NuGetCommand@2
  displayName: 'NuGet restore Configuration Packages'
  inputs:
    restoreSolution: tools/config/packages.config
    restoreDirectory: ConfigPackages
    feedsToUse: config
    nugetConfigPath: nuget.config

- ${{ if eq(parameters.configuration, 'Release') }}:
  - task: securedevelopmentteam.vss-secure-development-tools.build-task-credscan.CredScan@2
    displayName: 'Run CredScan'
    inputs:
      toolMajorVersion: 'V2'
      outputFormat: sarif
      debugMode: false

- task: CmdLine@2
  displayName: 'Bootstrap vcpkg'
  inputs:
    script: |
      cd $(Build.SourcesDirectory)
      git clone https://github.com/microsoft/vcpkg.git
      cd vcpkg
      bootstrap-vcpkg.bat -disableMetrics
    workingDirectory: '$(Build.SourcesDirectory)'
    failOnStderr: false

- task: CMake@1
  displayName: 'Configure oZKS'
  inputs:
    cmakeArgs: -S . -B build -DCMAKE_BUILD_TYPE='${{ parameters.configuration }}' -DOZKS_BUILD_TESTS=ON -DOZKS_BUILD_BENCH=ON -DCMAKE_TOOLCHAIN_FILE=$(Build.SourcesDirectory)\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
    workingDirectory: '$(Build.SourcesDirectory)'

- task: MSBuild@1
  displayName: 'Build oZKS'
  inputs:
    solution: '$(Build.SourcesDirectory)/build/ozks.sln'
    msbuildArchitecture: 'x64'
    platform: 'x64'
    configuration: '${{ parameters.configuration }}'

- task: CmdLine@2
  displayName: 'Run unit tests'
  inputs:
    script: |
      .\build\bin\${{ parameters.configuration }}\unit_tests.exe
    workingDirectory: '$(Build.SourcesDirectory)'
    failOnStderr: true

- task: CmdLine@2
  displayName: 'Remove unnecessary files'
  inputs:
    script: |
      cd $(Build.SourcesDirectory)
      rmdir /s /q vcpkg
      cd $(Build.SourcesDirectory)\build
      rmdir /s /q vcpkg_installed
    workingDirectory: '$(Build.SourcesDirectory)'
    failOnStderr: false

- task: PublishSymbols@2
  displayName: 'Publish symbols path'
  inputs:
    searchPattern: '**\bin\**\*.pdb'
    PublishSymbols: false
  continueOnError: true

- task: CopyFiles@2
  displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)'
    Contents: '**\${{ parameters.configuration }}\**\?(*.exe|*.dll|*.lib|*.xml)'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'

- task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
  displayName: 'Component Detection'

- ${{ if eq(parameters.configuration, 'Release') }}:
  - task: securedevelopmentteam.vss-secure-development-tools.build-task-publishsecurityanalysislogs.PublishSecurityAnalysisLogs@2
    displayName: 'Publish Security Analysis Logs'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: windows-drop
